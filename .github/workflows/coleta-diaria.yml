name: Coleta diária de ofertas

on:
  schedule:
    # horários em UTC (Brasília = UTC-3)
    - cron: "0 10 * * *"            # 07:00 todo dia: coleta completa (sites + encartes)
    - cron: "0 16 * * *"            # 13:00 todo dia: só sites (preço muda durante o dia)
    - cron: "0 13,20,23 28-31 * *"  # fim do mês, 10h, 17h e 20h: só sites (ofertas de virada de mês)
    - cron: "0 13,20,23 1-2 * *"    # começo do mês, 10h, 17h e 20h: só sites
  workflow_dispatch:                # botão "Run workflow" para atualizar na hora
    inputs:
      mercados:
        description: "Quais mercados (vazio = todos; 'sites' = só os sites, sem custo de API)"
        required: false
        default: "sites"

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: coleta            # nunca duas coletas ao mesmo tempo
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Escolher mercados
        id: alvo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            escolha="${{ inputs.mercados }}"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            escolha=""
          else
            escolha="sites"
          fi
          [ "$escolha" = "sites" ] && escolha="atacadao covabra paguemenos savegnago samsclub svicente goodbom"
          echo "lista=$escolha" >> "$GITHUB_OUTPUT"
          echo "Mercados: ${escolha:-todos}"
      - name: Navegador para os encartes do Assaí e do Cato
        # as páginas desses dois só mostram os encartes depois de abrir num navegador; os sites não precisam dele
        if: steps.alvo.outputs.lista == '' || contains(steps.alvo.outputs.lista, 'assai') || contains(steps.alvo.outputs.lista, 'cato')
        run: python -m playwright install --with-deps chromium
      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # quem lê os encartes: Claude até a variável EXTRATOR (groq ou gemini) ser criada (Settings → Secrets and variables → Actions → Variables)
          EXTRATOR: ${{ vars.EXTRATOR || 'claude' }}
          # modelo do Claude: Opus até a variável CLAUDE_MODELO ser criada (ex.: claude-sonnet-5-5, metade do preço)
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO || 'claude-opus-5-5' }}
        run: python rodar_coleta.py ${{ steps.alvo.outputs.lista }}
      - name: Ligar produtos ao cadastro base
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python catalogo.py || echo "cadastro base ainda não criado (migração 0011)"
      - name: Histórico de preços e limpeza
        # migração 0019: preço igual ao do dia anterior só estica o período; a tabela do dia guarda 7 dias
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python historico.py || echo "histórico ainda não criado (migração 0019)"
      - name: Preparar os preços do dia no app
        # monta a lista do dia no servidor logo após a coleta: a primeira pessoa a abrir o app não espera a carga
        if: always()
        run: |
          for i in 1 2; do
            curl -s -o /dev/null -w "api/ofertas: %{http_code} em %{time_total}s" --max-time 60 https://appmercato.vercel.app/api/ofertas || true
            echo
            sleep 20
          done
      - name: Avisos dos alertas (celular e e-mail)
        # uma vez por dia, depois da coleta completa das 7h e da lista do dia pronta no app (ou ao rodar à mão)
        if: always() && (github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AVISO_EMAIL_REMETENTE: ${{ vars.AVISO_EMAIL_REMETENTE }}
        run: python avisos.py
      - name: Resumo do banco
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python resumo_banco.py
