name: Medir precisão do extrator de encartes

# Lê um encarte com cada modelo e compara com o gabarito transcrito à mão (gabarito.json na pasta do encarte).
# Não grava nada no banco. Botão "Run workflow" na aba Actions; o resultado (tabela item por item) fica no Summary.
# Medições de 11/11/2026 (Assaí 26/10, páginas 1 a 3): Opus 99% dos preços certos, Sonnet 99%, Haiku 96%, Groq 82-86%.
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do encarte (com gabarito.json)"
        default: "encartes/assai/2026-10-26"
      modelos:
        description: "Modelos a medir, separados por espaço: opus sonnet haiku gemini groq"
        default: "opus sonnet haiku gemini"

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PASTA: ../${{ inputs.pasta }}
      MODELOS: ${{ inputs.modelos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ler o encarte com cada modelo
        run: |
          # páginas: as listadas em "paginas" no gabarito, ou todas as imagens e PDFs da pasta
          PAGINAS=$(python -c "import json,glob,os,sys; p=sys.argv[1]; g=json.load(open(os.path.join(p,'gabarito.json'),encoding='utf-8')); fs=[os.path.join(p,f) for f in g['paginas']] if g.get('paginas') else sorted(f for f in glob.glob(os.path.join(p,'*')) if f.lower().endswith(('.jpg','.jpeg','.png','.webp','.pdf'))); print(' '.join(fs))" "$PASTA")
          echo "Páginas: $PAGINAS"
          ler() {   # ler <prefixo>  (EXTRATOR e CLAUDE_MODELO já definidos)
            i=0; for p in $PAGINAS; do i=$((i+1))
              python -m coleta.extrator "$p" --mercado Teste --saida "$1-$i.json" || { echo "::warning::$1 falhou na página $p"; rm -f "$1"-*.json; return 0; }
            done
          }
          for m in $MODELOS; do
            echo "::group::$m"
            case "$m" in
              opus)   EXTRATOR=claude CLAUDE_MODELO=claude-opus-5-5   ler opus ;;
              sonnet) EXTRATOR=claude CLAUDE_MODELO=claude-sonnet-5-5 ler sonnet ;;
              haiku)  EXTRATOR=claude CLAUDE_MODELO=claude-haiku-5-5  ler haiku ;;
              gemini) if [ -n "$GEMINI_API_KEY" ]; then EXTRATOR=gemini CLAUDE_MODELO=claude-opus-5-5 ler gemini; else echo "::warning::sem o segredo GEMINI_API_KEY: Gemini não medido"; fi ;;
              groq)   if [ -n "$GROQ_API_KEY" ]; then EXTRATOR=groq CLAUDE_MODELO=claude-opus-5-5 ler groq; else echo "::warning::sem o segredo GROQ_API_KEY: Groq não medida"; fi ;;
              *)      echo "::warning::modelo desconhecido: $m" ;;
            esac
            echo "::endgroup::"
          done
      - name: Tabela item por item
        if: always()
        run: |
          args=()
          for m in $MODELOS; do
            case "$m" in
              opus) args+=("Opus 5.5=opus") ;; sonnet) args+=("Sonnet 5.5=sonnet") ;; haiku) args+=("Haiku 5.5=haiku") ;;
              gemini) args+=("Gemini (reserva Opus)=gemini") ;; groq) args+=("Groq (reserva Opus)=groq") ;;
            esac
          done
          { echo "## Encarte: ${{ inputs.pasta }}"; echo; python -m coleta.comparar_gabarito --tabela "$PASTA/gabarito.json" "${args[@]}"; } | tee -a "$GITHUB_STEP_SUMMARY"
